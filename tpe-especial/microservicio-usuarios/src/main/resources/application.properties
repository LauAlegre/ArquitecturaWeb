# Nombre de la aplicación
spring.application.name=microservicio-usuarios

# Configuración de conexión a MySQL (puerto 3307 porque el contenedor mapea así)
spring.datasource.url=jdbc:mysql://localhost:3307/appdb?serverTimezone=UTC
spring.datasource.username=usuario
spring.datasource.password=usuario123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Puerto del microservicio
server.port=8080
