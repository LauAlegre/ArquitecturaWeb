server:
  port: 8085

spring:
  application:
    name: gateway

  datasource:
    url: jdbc:h2:mem:gatewaydb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

  cloud:
    gateway:
      routes:

        # ----------------------------
        # 🔹 MICRO USUARIOS + CUENTAS
        # ----------------------------
        - id: usuarios
          uri: http://localhost:8080
          predicates:
            - Path=/usuarios/**, /cuentas/**

        # ----------------------------
        # 🔹 MICRO MONOPATINES
        # ----------------------------
        - id: monopatines
          uri: http://localhost:8083
          predicates:
            - Path=/monopatines/**, /paradas/**

        # ----------------------------
        # 🔹 MICRO VIAJES (v1)
        # ----------------------------
        - id: viajes
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/viajes/**

        # ----------------------------
        # 🔹 MICRO FACTURACIÓN
        # ----------------------------
        - id: facturacion
          uri: http://localhost:8082
          predicates:
            - Path=/facturas/**, /tarifas/**

        # ----------------------------
        # 🔹 AUTH (registrar / login)
        # ----------------------------
        - id: auth
          uri: http://localhost:8085
          predicates:
            - Path=/api/auth/**
