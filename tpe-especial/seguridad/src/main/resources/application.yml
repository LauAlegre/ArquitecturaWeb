server:
  port: 8085

spring:
  application:
    name: seguridad

  datasource:
    url: jdbc:h2:mem:seguridaddb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# IMPORTANTE:
