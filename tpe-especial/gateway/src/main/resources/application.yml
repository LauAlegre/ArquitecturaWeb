server:
  port: 8085

spring:
  application:
    name: gateway

  datasource:
    url: jdbc:h2:mem:gatewaydb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  cloud:
    gateway:
      mvc:
        routes:

          # ============================================
          # 🔵 MICROSERVICIO USUARIOS (8080)
          # ============================================
          - id: usuarios
            uri: http://localhost:8080
            predicates:
              - Path=/usuarios/**

          # ============================================
          # 🟢 MICROSERVICIO CUENTAS (8080)
          # ============================================
          - id: cuentas
            uri: http://localhost:8080
            predicates:
              - Path=/cuentas/**

          # ============================================
          # 🟡 MICROSERVICIO MONOPATINES (8083)
          # ============================================
          - id: monopatines
            uri: http://localhost:8083
            predicates:
              - Path=/monopatines/**

          # ============================================
          # 🟣 MICROSERVICIO PARADAS (8083)
          # ============================================
          - id: paradas
            uri: http://localhost:8083
            predicates:
              - Path=/paradas/**

          # ============================================
          # 🔴 MICROSERVICIO VIAJES (8081)
          # ============================================
          - id: viajes
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/viajes/**

          # ============================================
          # 🟠 MICROSERVICIO PAUSAS (también 8081)
          # Se enruta igual porque están dentro de /api/v1/viajes/{id}/pausas
          # ============================================
          - id: pausas
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/viajes/*/pausas/**

          # ============================================
          # 🟤 MICROSERVICIO FACTURACIÓN (8082)
          # Facturas y Tarifas
          # ============================================
          - id: facturacion
            uri: http://localhost:8082
            predicates:
              - Path=/facturas/**

          - id: tarifas
            uri: http://localhost:8082
            predicates:
              - Path=/tarifas/**

eureka:
  client:
    fetch-registry: false
    register-with-eureka: false
